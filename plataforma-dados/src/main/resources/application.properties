# =============================================================================
# plataforma-dados: COLETA (ingestão OLTP -> raw), PROCESSAMENTO (raw -> curated
# -> marts) e CONSUMO (API dos Data Marts) da FarmaRede.
# Profiles: %dev (quarkus:dev), %test (testes) e %prod (container / java -jar).
# Em dev/test os dois Postgres sobem sozinhos via Dev Services (precisa de Docker).
# =============================================================================
quarkus.application.name=plataforma-dados
quarkus.http.port=8080
quarkus.http.test-port=0

# ---------- Data Warehouse (datasource padrão) ----------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DW_DB_URL:jdbc:postgresql://localhost:5434/dw}
%prod.quarkus.datasource.username=${DW_DB_USER:farmarede}
%prod.quarkus.datasource.password=${DW_DB_PASSWORD}

# Schemas raw/curated/marts/controle são do Flyway (classpath:db/migration).
# Faixas de versão: V1-V99 base | V100-V199 Felipe | V200-V299 Romulo.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.log.sql=true

# ---------- Banco operacional (fonte, somente leitura) ----------
# Datasource nomeado "oltp": use @DataSource("oltp") AgroalDataSource para ler via JDBC.
quarkus.datasource.oltp.db-kind=postgresql
%prod.quarkus.datasource.oltp.jdbc.url=${OLTP_DB_URL:jdbc:postgresql://localhost:5433/oltp}
%prod.quarkus.datasource.oltp.username=${OLTP_DB_USER:farmarede}
%prod.quarkus.datasource.oltp.password=${OLTP_DB_PASSWORD}
# Em dev/test não há fontes-operacionais: aplicamos o schema + seed do OLTP no container
# do Dev Services. Em prod quem migra o OLTP é o fontes-operacionais.
quarkus.flyway.oltp.locations=db/oltp
quarkus.flyway.oltp.migrate-at-start=false
%dev.quarkus.flyway.oltp.migrate-at-start=true
%test.quarkus.flyway.oltp.migrate-at-start=true
# Nomes distintos garantem um container/banco por datasource no Dev Services
# (sem isso os dois V1 caem no mesmo banco e o Flyway acusa checksum diferente).
quarkus.datasource.devservices.db-name=dw
quarkus.datasource.oltp.devservices.db-name=oltp

# ---------- OpenAPI / Swagger UI (/q/swagger-ui) ----------
quarkus.swagger-ui.always-include=true

# ---------- Pipeline (Felipe) ----------
# TODO (Felipe): agenda do PipelineOrquestrador. Env: PIPELINE_HABILITADO, PIPELINE_CRON
pipeline.habilitado=true
%test.pipeline.habilitado=false
pipeline.cron=0 */2 * * * ?
