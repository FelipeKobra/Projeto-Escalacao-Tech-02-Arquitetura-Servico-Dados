name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e smoke test do Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Antes de tudo: os passos de log/limpeza também precisam do .env para o compose.
      - name: Prepara o .env
        run: cp .env.example .env

      - name: Formatação (Spotless)
        run: ./mvnw -B spotless:check

      # Testes usam Dev Services (Postgres em Docker), disponível no runner.
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Sobe a stack e espera os healthchecks
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8081/fontes/resumo
          curl -fsS http://localhost:8080/q/health/ready

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
