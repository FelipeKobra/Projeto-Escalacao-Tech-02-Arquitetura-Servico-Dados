# =============================================================================
# fontes-operacionais: simula os sistemas PRODUTORES de dados da FarmaRede
# (PDV das lojas, e-commerce e estoque) gravando no banco operacional (oltp-db).
# Profiles: %dev (quarkus:dev), %test (testes) e %prod (container / java -jar).
# Em dev/test o Postgres sobe sozinho via Dev Services (precisa de Docker).
# =============================================================================
quarkus.application.name=fontes-operacionais
quarkus.http.port=8081
quarkus.http.test-port=0

# ---------- Banco operacional (OLTP) ----------
quarkus.datasource.db-kind=postgresql
# prod: vem do docker-compose (.env). Sem senha definida, a app falha ao subir.
%prod.quarkus.datasource.jdbc.url=${OLTP_DB_URL:jdbc:postgresql://localhost:5433/oltp}
%prod.quarkus.datasource.username=${OLTP_DB_USER:farmarede}
%prod.quarkus.datasource.password=${OLTP_DB_PASSWORD}

# O schema é do Flyway (módulo oltp-schema, classpath:db/oltp); o Hibernate não mexe nele.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/oltp
quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.log.sql=true

# ---------- OpenAPI / Swagger UI (/q/swagger-ui) ----------
quarkus.swagger-ui.always-include=true

# ---------- Simulador de vendas (Felipe) ----------
# Chaves lidas pelo SimuladorVendas (@ConfigMapping prefix "simulador").
# Env: SIMULADOR_HABILITADO, SIMULADOR_INTERVALO, SIMULADOR_VENDAS_POR_CICLO
simulador.habilitado=true
%test.simulador.habilitado=false
simulador.intervalo=10s
simulador.vendas-por-ciclo=5
